name: Testes do Arena Fácil

on: [push, pull_request]

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena_local
          POSTGRES_DB: arena_facil_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena -d arena_facil_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      ARENA_TEST_DATABASE_URL: postgresql://arena:arena_local@localhost:5432/arena_facil_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
